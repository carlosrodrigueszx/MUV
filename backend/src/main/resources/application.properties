spring.application.name=backend
spring.profiles.active=dev

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${MUV_AUTH_SECURE_COOKIE:false}
server.servlet.session.timeout=30m
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

muv.demo.dispensar-verificacao=${MUV_DEMO_DISPENSAR_VERIFICACAO:false}

# Estimativa de frete. Configure um perfil aprovado em muv.estimativa.pessoa ou
# muv.estimativa.encomenda. Sem uma referência válida a estimativa fica indisponível.
# Chaves do perfil: consumo-km-litro, preco-litro, fonte-combustivel,
# data-combustivel (AAAA-MM-DD), validade-dias, operacao-por-km (R$/km),
# remuneracao (R$) e alerta-percentual (pontos percentuais acima do estimado).
# Para habilitar o piso na oferta inicial, configure piso-fator (maior que 0 e
# até 1) e piso-minimo (R$), com custos operacionais de referência positivos.
# Ative o teto por modalidade com teto-ativo=true após validar o perfil.
# teto-percentual define os pontos percentuais acima do estimado (padrão: 50).
# Aplique um teto igual ou superior ao limiar de alerta do perfil.
